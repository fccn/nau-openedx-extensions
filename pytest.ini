[tool:pytest]
DJANGO_SETTINGS_MODULE = nau_openedx_extensions.settings.test

[pytest]
django_find_project = false
; addopts = --ds=lms.envs.test --reuse-db
; addopts = --ds=nau_openedx_extensions.settings.test --durations=20 --json-report --json-report-omit keywords streams collectors log traceback tests --json-report-file=none
; log_cli = 1
log_cli_level = INFO
timeout = 60
timeout_method = thread
timeout_func_only = true
