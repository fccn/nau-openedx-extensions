<div class="certificate-export-section">
  <p>In this section you can export the course certificates in different formats.</p>

  <div class="certificate-export-controls">
    <h3>Export options</h3>

    <div class="action-item">
      <div class="action-item-content">
        <p>Download a CSV file with the details of all certificates generated for this course.</p>
        <button class="btn btn-primary" id="export-csv-certificates"
                data-endpoint="{{ certificate_export_url }}">
            Export certificates CSVs
        </button>
      </div>
    </div>

    <div class="action-item">
      <div class="action-item-content">
        <p>Download a ZIP file containing all certificates in PDF format for this course.</p>
        <button class="btn btn-primary" id="export-zip-certificates">
          Export certificates PDF as ZIP
        </button>
      </div>
    </div>
  </div>

  <div class="certificate-export-status" style="display:none;">
    <div class="message-status error" style="display:none;"></div>
    <div class="message-status success" style="display:none;"></div>
    <div class="message-status info" style="display:none;"></div>
    <div class="message-status warning" style="display:none;"></div>
  </div>
</div>
