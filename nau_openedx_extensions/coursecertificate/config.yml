NAU_SEND_COURSE_CERTIFICATE_CONFIG:
  - service_name: portugal_digital
    endpoint_url: https://academiaportugaldigital.pt/api/api/Course/FinishedIntegrationNau
    auth_token: XXXXXXXXXXXXXXXXXXXXX
    auth_type: bearer
    auth_header: Authorization
    page_size: 100
    days: 30
    fields:
      - name: email
        type: standard
        model_field: user__email
        trans: md5
      - name: username
        type: standard
        model_field: user__username
        trans: base64
      - name: name
        type: standard
        model_field: user__profile__name
      - name: nif
        type: standard
        model_field: user__nauuserextendedmodel__nif
      - name: certificate_date
        type: standard
        model_field: created_date
      - name: certificate_url
        type: concatenated
        model_field: verify_uuid
        concat: certificate_url
      - name: course_id
        type: standard
        model_field: course_id
      - name: course_name
        type: computed
        subquery: course_name
      - name: enrolled_date
        type: computed
        subquery: enrolled_date
      - name: course_code
        type: substring
        substring: course_number
    filters:
      - name: certificate_by_course_id_regex
        args: course-v1
      - name: certificate_by_org
        args: EduNext
